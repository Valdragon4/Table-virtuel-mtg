services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-mtg}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mtg} -d ${POSTGRES_DB:-mtg}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mtg}?schema=public
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?définis SESSION_SECRET dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      SCRYFALL_USER_AGENT: ${SCRYFALL_USER_AGENT}
      INGEST_ON_BOOT: ${INGEST_ON_BOOT:-true}
      INGEST_CRON_HOUR: ${INGEST_CRON_HOUR:-4}
      ARCHIDEKT_USER_AGENT: ${ARCHIDEKT_USER_AGENT}
      ARCHIDEKT_RATE_PER_MIN: ${ARCHIDEKT_RATE_PER_MIN:-30}
      ARCHIDEKT_CACHE_TTL_SECONDS: ${ARCHIDEKT_CACHE_TTL_SECONDS:-900}
      MOXFIELD_API_ENABLED: ${MOXFIELD_API_ENABLED:-false}
      MOXFIELD_USER_AGENT: ${MOXFIELD_USER_AGENT:-}
      MOXFIELD_API_TOKEN: ${MOXFIELD_API_TOKEN:-}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
